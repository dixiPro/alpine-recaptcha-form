<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpine.js reCAPTCHA Form - Demo</title>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Alpine reCAPTCHA Form Handler -->
  <script src="./alpine-recaptcha-form.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 2.5rem;
    }
    
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .header h1 {
      color: #333;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    
    .header p {
      color: #666;
      font-size: 0.95rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
    }
    
    .form-group label .required {
      color: #e74c3c;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group input:disabled,
    .form-group textarea:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .alert {
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .alert-error {
      background: #fee;
      color: #c00;
      border: 1px solid #fcc;
    }
    
    .alert-success {
      background: #efe;
      color: #070;
      border: 1px solid #cfc;
    }
    
    .alert-info {
      background: #e3f2fd;
      color: #1976d2;
      border: 1px solid #bbdefb;
    }
    
    .recaptcha-badge {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
    }
    
    .recaptcha-badge a {
      color: #667eea;
      text-decoration: none;
    }
    
    .recaptcha-badge a:hover {
      text-decoration: underline;
    }
    
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .footer {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 0.9rem;
    }
    
    .footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>📧 Contact Form</h1>
        <p>Alpine.js with reCAPTCHA v3 Demo</p>
      </div>
      
      <form 
        method="post" 
        action="/api/submit-form" 
        x-data="formHandler()" 
        @submit.prevent="sendForm"
      >
        <!-- 
          IMPORTANT: Replace YOUR_RECAPTCHA_SITE_KEY with your actual Site Key
          Get your key here: https://www.google.com/recaptcha/admin
        -->
        <input type="hidden" name="recaptureKey" value="YOUR_RECAPTCHA_SITE_KEY">
        
        <div class="form-group">
          <label for="name">
            Your Name <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="John Doe"
            required
            :disabled="sending"
          >
        </div>
        
        <div class="form-group">
          <label for="email">
            Email <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="john@example.com"
            required
            :disabled="sending"
          >
        </div>
        
        <div class="form-group">
          <label for="phone">Phone</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="+1 (555) 123-4567"
            :disabled="sending"
          >
        </div>
        
        <div class="form-group">
          <label for="message">
            Message <span class="required">*</span>
          </label>
          <textarea 
            id="message" 
            name="message" 
            placeholder="Write your message..."
            required
            :disabled="sending"
          ></textarea>
        </div>
        
        <button 
          type="submit" 
          :disabled="sending"
          class="btn-submit"
        >
          <template x-if="!sending">
            <span>📧 Send Message</span>
          </template>
          <template x-if="sending">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <div class="spinner"></div>
              <span>Sending...</span>
            </div>
          </template>
        </button>
        
        <!-- Demo info message -->
        <div class="alert alert-info" style="margin-top: 1rem;">
          ℹ️ <strong>Demo Mode:</strong> Don't forget to replace <code>YOUR_RECAPTCHA_SITE_KEY</code> with your actual reCAPTCHA key and configure the server-side.
        </div>
        
        <!-- Error message -->
        <template x-if="errorMsg">
          <div 
            class="alert alert-error"
            x-text="errorMsg"
            x-transition
          ></div>
        </template>
        
        <!-- Success message -->
        <template x-if="done && !errorMsg">
          <div 
            class="alert alert-success"
            x-transition
          >
            ✅ <strong>Thank you!</strong> Your message has been sent successfully. We'll get back to you soon.
          </div>
        </template>
        
        <div class="recaptcha-badge">
          Protected by reCAPTCHA<br>
          <a href="https://policies.google.com/privacy" target="_blank">Privacy</a> • 
          <a href="https://policies.google.com/terms" target="_blank">Terms</a>
        </div>
      </form>
    </div>
    
    <div class="footer">
      Made with ❤️ for the Alpine.js community<br>
      <a href="https://github.com/yourusername/alpine-recaptcha-form" target="_blank">
        GitHub Repository
      </a>
    </div>
  </div>
</body>
</html>
